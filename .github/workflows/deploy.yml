# Puts the site on the server. Runs when main changes, or by hand from the Actions tab.
# Needs the secrets DEPLOY_HOST and DEPLOY_SSH_KEY (Settings → Secrets and variables → Actions),
# and SMTP_PASSWORD (the password of the mailbox info@gatra.nl) for the forms.
# Optional: DEPLOY_USER (variable or secret, default root) and the variable DEPLOY_PATH (default /srv/gatra/public).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      REMOTE_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER || 'root' }}
      REMOTE_PATH: ${{ vars.DEPLOY_PATH || '/srv/gatra/public' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the pages
        run: node build.mjs
      - name: Check the settings
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::The secrets DEPLOY_HOST and DEPLOY_SSH_KEY are not set, so nothing was sent to the server."
            exit 1
          fi
          case "$REMOTE_PATH" in
            /*/public) ;;
            *) echo "::error::DEPLOY_PATH must be a full path that ends in /public."; exit 1 ;;
          esac
      - name: Send the site to the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a usable private key. It must be the whole block from -----BEGIN OPENSSH PRIVATE KEY----- to -----END OPENSSH PRIVATE KEY-----, without a passphrase."
            exit 1
          fi
          echo "Logging in as $REMOTE_USER with the key whose public fingerprint is:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The folder may belong to root; then the copy runs through sudo, if the user may use it without a password.
          if ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$HOST" "mkdir -p '$REMOTE_PATH' 2>/dev/null && test -w '$REMOTE_PATH'"; then
            REMOTE_RSYNC=rsync
          elif ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$HOST" "sudo -n true"; then
            REMOTE_RSYNC="sudo -n rsync"
            ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$HOST" "sudo -n mkdir -p '$REMOTE_PATH'"
          else
            echo "::error::$REMOTE_USER cannot write to $REMOTE_PATH on the server and has no sudo without a password. Give that user ownership of the folder."
            exit 1
          fi
          rsync -rlz --delete --chmod=D755,F644 --rsync-path="$REMOTE_RSYNC" -e "ssh -i ~/.ssh/deploy_key" public/ "$REMOTE_USER@$HOST:$REMOTE_PATH/"
      - name: Start the form service
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::The secret SMTP_PASSWORD is not set, so the form service was not started and the forms cannot send mail."
            exit 0
          fi
          TARGET="$REMOTE_USER@$HOST"
          DIR="$(dirname "$REMOTE_PATH")/form"
          ssh -i ~/.ssh/deploy_key "$TARGET" "sudo -n mkdir -p '$DIR/secret' && sudo -n chmod 700 '$DIR/secret'"
          rsync -rlz --delete --exclude secret --exclude node_modules --chmod=D755,F644 --rsync-path="sudo -n rsync" -e "ssh -i ~/.ssh/deploy_key" server/ "$TARGET:$DIR/"
          # The mailbox password goes into a file only root can reach; the container gets it read-only.
          printf '%s\n' "$SMTP_PASSWORD" | ssh -i ~/.ssh/deploy_key "$TARGET" "sudo -n tee '$DIR/secret/smtp_password' > /dev/null && sudo -n chmod 444 '$DIR/secret/smtp_password'"
          ssh -i ~/.ssh/deploy_key "$TARGET" "sudo -n docker network inspect gatra > /dev/null 2>&1 || sudo -n docker network create gatra; cd '$DIR' && sudo -n docker compose up -d --build && sleep 4 && sudo -n docker compose ps && sudo -n docker compose logs --tail 5"
